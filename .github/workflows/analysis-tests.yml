name: Analysis regressions

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'scripts/golden-analysis.sh'
      - '.github/workflows/analysis-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: ./scripts/golden-analysis.sh
