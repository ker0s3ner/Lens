name: Large-file performance gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - name: Build optimized Lens
        run: cargo build --release --locked --bin lens
      - name: Measure static analysis and verify fixture metadata
        run: python3 scripts/large-file-gate.py target/release/lens
