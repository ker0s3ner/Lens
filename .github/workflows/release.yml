name: Release (macOS Apple Silicon)

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != Cargo version v$V"; exit 1; }
      - name: Build Lens.app
        run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lens-macos-arm64
          path: dist/Lens-macos-arm64.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lens-macos-arm64.zip
          body_path: RELEASE_NOTES.md
