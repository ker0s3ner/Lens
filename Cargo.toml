[package]
name = "lens"
version = "0.6.448"
edition = "2021"
description = "Lens - a clean, friendly disassembler for x86/x64 programs (ELF, PE, Mach-O)"

[[bin]]
name = "lens"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
goblin = "0.10"
rfd = "0.18"
cpp_demangle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-demangle = "0.1.28"
capstone = "0.13"
rhai = "1"
libc = "0.2"
ab_glyph = "0.2"
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
object = { version = "0.36", default-features = false, features = ["read_core", "std", "macho", "elf", "pe", "unaligned"] }
pdb = "0.8"

ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
muda = "0.17"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
